name: CI
on:
  push:
    paths:
      - "ai-business-analytics/**"
  pull_request:
    paths:
      - "ai-business-analytics/**"
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-business-analytics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest -q
